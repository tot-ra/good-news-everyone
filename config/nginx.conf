server {
    server_name good.kurapov.ee;

    client_body_buffer_size 100m;
    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css application/json image/svg+xml;

    # Vite production build is published from dist/ to public/ by restart.sh
    root /www/good.kurapov.ee/public;
    index index.html;

    # Hashed Vite bundles can be cached aggressively
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot

    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    ssl_certificate /etc/letsencrypt/live/good.kurapov.ee/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/good.kurapov.ee/privkey.pem; # managed by Certbot
}

server {
    if ($host = good.kurapov.ee) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name good.kurapov.ee;
    return 404; # managed by Certbot
}
